# Verwaltung der Fotografie-Homepage (Sveltia CMS)

backend:
  name: github
  repo: moonlink82/fotografie-homepage
  branch: main

media_folder: bilder
public_folder: /bilder

# Hochgeladene Fotos werden automatisch verkleinert (max. 2560 px)
# und als WebP gespeichert.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 88
        width: 2560
        height: 2560

collections:
  - name: fotos
    label: Fotos
    files:
      - name: fotos
        label: Alle Fotos
        file: daten/fotos.json
        fields:
          - name: fotos
            label: Fotos
            label_singular: Foto
            widget: list
            add_to_top: true
            collapsed: true
            typeKey: kategorie
            types:

              # ---------------- ASTROFOTO ----------------
              - name: astro
                label: Astrofoto
                summary: "{{titel}} – {{datum}}"
                fields:
                  - { name: bild, label: Bild, widget: image, required: false, hint: "Ohne Bild wird ein Platzhalter angezeigt." }
                  - { name: titel, label: Titel, widget: string, hint: "z. B. Herznebel (IC 1805)" }
                  - { name: datum, label: Aufnahmedatum, widget: datetime, time_format: false, date_format: DD.MM.YYYY, format: YYYY-MM-DD, hint: "Bei mehreren Nächten: die letzte. Die neuesten Bilder erscheinen oben." }
                  - { name: ort, label: Ort, widget: string, required: false }
                  - { name: beschreibung, label: Beschreibung, widget: text, required: false, hint: "Eine kurze erste Zeile ohne Punkt wird als Zwischenüberschrift angezeigt (oder mit # beginnen). Leerzeile = neuer Absatz." }
                  - { name: teleskop, label: Teleskop / Objektiv, widget: string, required: false, hint: "z. B. Refraktor 72/420" }
                  - { name: kamera, label: Kamera, widget: string, required: false }
                  - name: ha
                    label: "H-Alpha"
                    widget: object
                    required: false
                    fields:
                      - { name: anzahl, label: Anzahl Aufnahmen, widget: number, value_type: int, required: false }
                      - { name: sekunden, label: Sekunden pro Aufnahme, widget: number, value_type: float, required: false }
                      - { name: gain, label: Gain, widget: number, value_type: int, required: false }
                  - name: oiii
                    label: "OIII"
                    widget: object
                    required: false
                    fields:
                      - { name: anzahl, label: Anzahl Aufnahmen, widget: number, value_type: int, required: false }
                      - { name: sekunden, label: Sekunden pro Aufnahme, widget: number, value_type: float, required: false }
                      - { name: gain, label: Gain, widget: number, value_type: int, required: false }
                  - name: duo
                    label: "Duo-Narrowband"
                    widget: object
                    required: false
                    fields:
                      - { name: anzahl, label: Anzahl Aufnahmen, widget: number, value_type: int, required: false }
                      - { name: sekunden, label: Sekunden pro Aufnahme, widget: number, value_type: float, required: false }
                      - { name: gain, label: Gain, widget: number, value_type: int, required: false }
                  - name: rgb
                    label: "RGB"
                    widget: object
                    required: false
                    fields:
                      - { name: anzahl, label: Anzahl Aufnahmen, widget: number, value_type: int, required: false }
                      - { name: sekunden, label: Sekunden pro Aufnahme, widget: number, value_type: float, required: false }
                      - { name: gain, label: Gain, widget: number, value_type: int, required: false }
                  - { name: sonstiges, label: Sonstiges, widget: string, required: false, hint: "z. B. Montierung, Filter, Software" }

              # ---------------- NATUR & LANDSCHAFT ----------------
              - name: natur
                label: Natur- & Landschaftsfoto
                summary: "{{titel}} – {{datum}}"
                fields:
                  - { name: bild, label: Bild, widget: image, required: false, hint: "Ohne Bild wird ein Platzhalter angezeigt." }
                  - { name: titel, label: Titel, widget: string }
                  - { name: datum, label: Aufnahmedatum, widget: datetime, time_format: false, date_format: DD.MM.YYYY, format: YYYY-MM-DD, hint: "Die neuesten Bilder erscheinen automatisch oben." }
                  - { name: ort, label: Ort, widget: string, required: false }
                  - { name: beschreibung, label: Beschreibung, widget: text, required: false, hint: "Eine kurze erste Zeile ohne Punkt wird als Zwischenüberschrift angezeigt (oder mit # beginnen). Leerzeile = neuer Absatz." }
                  - { name: kamera, label: Kamera, widget: string, required: false, hint: "Kameradaten aus dem Foto auslesen: lichtweite.photos/admin/exif.html" }
                  - { name: objektiv, label: Objektiv, widget: string, required: false, hint: "z. B. 24–70 mm f/2.8" }
                  - { name: brennweite, label: Brennweite (mm), widget: number, value_type: int, required: false }
                  - { name: blende, label: Blende, widget: string, required: false, hint: "z. B. 8 oder f/8" }
                  - { name: verschlusszeit, label: Verschlusszeit, widget: string, required: false, hint: "z. B. 1/250 oder 30 (Sekunden)" }
                  - { name: iso, label: ISO, widget: number, value_type: int, required: false }
                  - { name: sonstiges, label: Sonstiges, widget: string, required: false, hint: "z. B. ND-Filter, Panorama aus 6 Bildern" }

  - name: einstellungen
    label: Einstellungen
    files:
      - name: einstellungen
        label: Seiteninhalte & Preise
        file: daten/einstellungen.json
        fields:
          - { name: name, label: "Name / Marke (Logo)", widget: string }
          - { name: zusatz, label: "Zusatz im Logo", widget: string, required: false }
          - { name: email, label: "E-Mail-Adresse (Kontakt & Druckanfragen)", widget: string }
          - { name: instagram, label: "Instagram-Link", widget: string, required: false }
          - { name: seo_beschreibung, label: "Kurzbeschreibung für Google (ca. 150 Zeichen)", widget: text, required: false, hint: "Erscheint in den Google-Suchergebnissen unter dem Titel. Wichtige Begriffe nennen, z. B. Astrofotografie, Region." }
          - { name: startseite_text, label: "Text auf der Startseite", widget: text, required: false }
          - { name: astro_text, label: "Einleitung Astro", widget: text, required: false }
          - { name: natur_text, label: "Einleitung Natur & Landschaft", widget: text, required: false }
          - { name: ueber_titel, label: "Über mich – Überschrift", widget: string, required: false }
          - { name: ueber_text, label: "Über mich – Text (Leerzeile = neuer Absatz)", widget: text, required: false }
          - { name: ueber_bild, label: "Über mich – Porträtfoto", widget: image, required: false }
          - name: ausruestung
            label: Ausrüstung
            label_singular: Eintrag
            widget: list
            required: false
            field: { name: eintrag, label: Eintrag, widget: string }
          - { name: druck_hinweis, label: "Hinweis auf Drucke (in der Bildansicht)", widget: text, required: false, hint: "Erscheint in den Details jedes Bildes, darunter steht automatisch ein Link „Anfrage per E-Mail“." }
          - { name: impressum, label: "Impressum (Name, Anschrift)", widget: text }
          - { name: datenschutz, label: "Datenschutzerklärung", widget: text }
